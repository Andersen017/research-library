<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Гидробур для LiuGong 9027F ZTS</title><style>body{margin:0;background:#e7eadf;color:#2b312b;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.loader{min-height:70vh;display:grid;place-items:center;padding:24px}.box{max-width:560px;text-align:center;background:#f8f7ef;border:1px solid #d0d6c8;border-radius:18px;padding:24px}.dot{width:28px;height:28px;margin:0 auto 14px;border:3px solid #d0d6c8;border-top-color:#6d7857;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#687168}</style></head><body><div class="loader"><div class="box"><div class="dot"></div><strong>Открываю исследование</strong><br><small>Загружается HTML‑версия v1.1</small></div></div><script>(async()=>{try{const files=Array.from({length:11},(_,i)=>`part${String(i+1).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="loader"><div class="box"><strong>Не удалось загрузить исследование.</strong><br><small>Проверьте доступность файлов публикации.</small></div></div>'}})();</script></body></html>
